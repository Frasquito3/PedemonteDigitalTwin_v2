[tool.ruff]
target-version = "py311"
line-length = 100
indent-width = 4
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "docs_site",
    "docs",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line length handled by ruff format
    "E402",  # module level import not at top (needed for sys.path manipulation in standalone scripts)
    "UP042", # keep standard (str, Enum) compatibility across serialization libraries
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pedidos</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
    
    <!-- SheetJS (xlsx import/export) -->
    <script src="https://cdn.sheetjs.com/xlsx-latest/package/dist/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-dark: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.95);
            --panel-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --accent: #10b981;
            --accent-hover: #059669;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: #1e293b;
            --input-border: #475569;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            display: flex;
        }

        /* Sidebar Container */
        #sidebar {
            width: 440px;
            height: 100vh;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--panel-border);
            display: flex;
            flex-direction: column;
            z-index: 1000;
            box-shadow: 4px 0 24px rgba(0, 0, 0, 0.4);
        }

        .header {
            padding: 20px 24px;
            background: rgba(15, 23, 42, 0.6);
            border-bottom: 1px solid var(--panel-border);
        }

        .header h1 {
            font-size: 1.35rem;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .content {
            padding: 20px 24px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: rgba(15, 23, 42, 0.5);
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 600;
            color: #e2e8f0;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group.full-width {
            grid-column: span 2;
        }

        label {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        input[type="text"],
        input[type="number"],
        input[type="time"],
        select {
            width: 100%;
            padding: 8px 12px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            transition: all 0.2s;
        }

        select {
            cursor: pointer;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25);
        }

        .coords-box {
            font-family: 'JetBrains Mono', monospace;
            background: #090d16;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 0.82rem;
            color: #38bdf8;
            border: 1px dashed #334155;
            text-align: center;
        }

        .toggle-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--input-bg);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--input-border);
            cursor: pointer;
        }

        .toggle-group label {
            cursor: pointer;
            text-transform: none;
            font-size: 0.9rem;
            color: #f1f5f9;
        }

        .switch {
            position: relative;
            display: inline-block;
            width: 44px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #475569;
            transition: .3s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 18px;
            width: 18px;
            left: 3px;
            bottom: 3px;
            background-color: white;
            transition: .3s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: var(--primary);
        }

        input:checked + .slider:before {
            transform: translateX(20px);
        }

        .btn {
            width: 100%;
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .btn-success {
            background: #10b981;
            color: white;
        }

        .btn-success:hover {
            background: #059669;
        }

        .btn-success:disabled, .btn-primary:disabled {
            background: #334155;
            color: #64748b;
            cursor: not-allowed;
            box-shadow: none;
        }

        .btn-secondary {
            background: #334155;
            color: #f1f5f9;
            border: 1px solid var(--input-border);
        }

        .btn-secondary:hover {
            background: #475569;
        }

        .action-row {
            display: flex;
            gap: 8px;
        }

        /* Pedidos Table List */
        .pedidos-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
        }

        .pedido-item {
            background: #1e293b;
            border: 1px solid var(--panel-border);
            border-radius: 8px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 0.85rem;
            transition: border-color 0.2s;
        }

        .pedido-item:hover {
            border-color: var(--primary);
        }

        .pedido-info {
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .pedido-id {
            font-weight: 700;
            color: #38bdf8;
        }

        .pedido-details {
            color: var(--text-muted);
            font-size: 0.78rem;
        }

        .badge-turno {
            display: inline-block;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-manana {
            background: rgba(59, 130, 246, 0.2);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.4);
        }

        .badge-tarde {
            background: rgba(245, 158, 11, 0.2);
            color: #fbbf24;
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .btn-delete {
            background: rgba(239, 68, 68, 0.15);
            color: #ef4444;
            border: 1px solid rgba(239, 68, 68, 0.3);
            width: 28px;
            height: 28px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: all 0.2s;
        }

        .btn-delete:hover {
            background: var(--danger);
            color: white;
        }

        /* Map Container */
        #map {
            flex: 1;
            height: 100vh;
            background: #020617;
        }

        /* Custom Leaflet Marker Styling */
        .custom-marker {
            background: #3b82f6;
            border: 2px solid #ffffff;
            color: white;
            font-weight: bold;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            font-size: 11px;
        }
        .custom-marker.volcador {
            background: #10b981;
        }

        details summary {
            cursor: pointer;
            font-size: 0.82rem;
            color: var(--primary);
            font-weight: 500;
            user-select: none;
            padding: 4px 0;
        }

        details summary:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="header">
            <h1>Gestión de Pedidos</h1>
            <p>Captura de ubicaciones y contrato Excel</p>
        </div>

        <div class="content">

            <!-- Form Card -->
            <div class="card">
                <div class="card-title">
                    <span>Cargar Nuevo Pedido</span>
                    <span id="selected-coords-status" style="font-size: 0.75rem; color: #f59e0b;">Sin punto marcado</span>
                </div>

                <div class="form-grid">
                    <div class="form-group">
                        <label for="input-id">ID Pedido</label>
                        <input type="text" id="input-id" value="P001" placeholder="Ej: P001">
                    </div>

                    <div class="form-group">
                        <label for="input-turno">Turno</label>
                        <select id="input-turno">
                            <option value="MANANA">MANANA</option>
                            <option value="TARDE">TARDE</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label>Coordenadas Seleccionadas</label>
                        <div class="coords-box" id="coords-display">
                            Lat: - | Lng: -
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="input-capacidad">Unidades Capacidad</label>
                        <input type="number" id="input-capacidad" value="1" min="1" step="1">
                    </div>

                    <div class="form-group">
                        <label>Volcador</label>
                        <div class="toggle-group" onclick="document.getElementById('input-volcador').click(); event.stopPropagation();">
                            <label style="font-size:0.82rem;">Requiere (1/0)</label>
                            <label class="switch" onclick="event.stopPropagation();">
                                <input type="checkbox" id="input-volcador">
                                <span class="slider"></span>
                            </label>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="time-desde">Hora Desde</label>
                        <input type="time" id="time-desde">
                    </div>

                    <div class="form-group">
                        <label for="time-hasta">Hora Hasta</label>
                        <input type="time" id="time-hasta">
                    </div>

                    <div class="form-group full-width">
                        <details>
                            <summary>Campos adicionales (Cliente, Dirección, Barrio, Observaciones)</summary>
                            <div class="form-grid" style="margin-top: 10px;">
                                <div class="form-group">
                                    <label for="input-cliente">Cliente</label>
                                    <input type="text" id="input-cliente" placeholder="Cliente A">
                                </div>
                                <div class="form-group">
                                    <label for="input-direccion">Dirección</label>
                                    <input type="text" id="input-direccion" placeholder="Calle 123">
                                </div>
                                <div class="form-group">
                                    <label for="input-barrio">Barrio</label>
                                    <input type="text" id="input-barrio" placeholder="Centro">
                                </div>
                                <div class="form-group">
                                    <label for="input-observaciones">Observaciones</label>
                                    <input type="text" id="input-observaciones" placeholder="Notas">
                                </div>
                            </div>
                        </details>
                    </div>
                </div>

                <button class="btn btn-primary" style="margin-top: 14px;" onclick="agregarPedido()">
                    Agregar Pedido al Mapa
                </button>
            </div>

            <!-- List Card -->
            <div class="card" style="flex: 1; display: flex; flex-direction: column;">
                <div class="card-title">
                    <span>Pedidos Cargados (<span id="count-pedidos">0</span>)</span>
                    <button style="background: none; border: none; color: #ef4444; font-size: 0.78rem; cursor: pointer;" onclick="limpiarTodo()" id="btn-limpiar">Vaciar todo</button>
                </div>
                
                <div class="pedidos-list" id="pedidos-container">
                    <div style="text-align: center; color: #64748b; padding: 20px; font-size: 0.85rem;">
                        No hay puntos agregados todavía.
                    </div>
                </div>
            </div>

            <!-- Actions Row: Export & Import -->
            <div class="action-row">
                <button class="btn btn-success" id="btn-exportar" onclick="exportarExcel()" disabled style="flex: 1;">
                    Exportar a Excel
                </button>

                <input type="file" id="file-import" accept=".xlsx, .xls" style="display: none;" onchange="importarExcel(event)">
                <button class="btn btn-secondary" onclick="document.getElementById('file-import').click()" style="width: auto;">
                    Cargar Excel
                </button>
            </div>

        </div>
    </div>

    <!-- Map -->
    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>

    <script>
        const INITIAL_CENTER = [-32.8520, -60.7100];
        
        let map;
        let tempMarker = null;
        let selectedLat = null;
        let selectedLng = null;
        let pedidos = [];
        let mapMarkers = [];
        let autoIdCounter = 1;

        // Initialize Map
        function initMap() {
            map = L.map('map', {
                center: INITIAL_CENTER,
                zoom: 14,
                zoomControl: true
            });

            // Street Map Tiles (voyager clean style)
            L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/">CARTO</a>',
                subdomains: 'abcd',
                maxZoom: 19
            }).addTo(map);

            // Click event on map
            map.on('click', function(e) {
                selectedLat = parseFloat(e.latlng.lat.toFixed(5));
                selectedLng = parseFloat(e.latlng.lng.toFixed(5));

                document.getElementById('coords-display').innerText = `Lat: ${selectedLat} | Lng: ${selectedLng}`;
                document.getElementById('selected-coords-status').innerText = 'Punto seleccionado';
                document.getElementById('selected-coords-status').style.color = '#10b981';

                if (tempMarker) {
                    map.removeLayer(tempMarker);
                }

                tempMarker = L.marker([selectedLat, selectedLng], {
                    opacity: 0.8
                }).addTo(map);

                tempMarker.bindPopup(`<b>Punto seleccionado</b><br>Lat: ${selectedLat}<br>Lng: ${selectedLng}`).openPopup();
            });
        }

        function getNextDefaultId() {
            let nextIdStr = `P${String(autoIdCounter).padStart(3, '0')}`;
            while (pedidos.some(p => p.pedido_id === nextIdStr)) {
                autoIdCounter++;
                nextIdStr = `P${String(autoIdCounter).padStart(3, '0')}`;
            }
            return nextIdStr;
        }

        function agregarPedido() {
            if (selectedLat === null || selectedLng === null) {
                alert('Por favor, primero haz clic en una ubicación del mapa.');
                return;
            }

            const idVal = document.getElementById('input-id').value.trim();
            const turnoVal = document.getElementById('input-turno').value;
            const capacidadVal = parseInt(document.getElementById('input-capacidad').value, 10);
            const volcadorVal = document.getElementById('input-volcador').checked ? 1 : 0;
            
            const horaDesdeVal = document.getElementById('time-desde').value.trim();
            const horaHastaVal = document.getElementById('time-hasta').value.trim();

            const clienteVal = document.getElementById('input-cliente').value.trim();
            const direccionVal = document.getElementById('input-direccion').value.trim();
            const barrioVal = document.getElementById('input-barrio').value.trim();
            const observacionesVal = document.getElementById('input-observaciones').value.trim();

            // Validations according to contract
            if (!idVal) {
                alert('Por favor ingresa un pedido_id válido.');
                return;
            }

            if (pedidos.some(p => p.pedido_id === idVal)) {
                alert(`El pedido_id "${idVal}" ya existe. Debe ser único.`);
                return;
            }

            if (isNaN(capacidadVal) || capacidadVal <= 0) {
                alert('Las unidades de capacidad deben ser un entero mayor a 0.');
                return;
            }

            if ((horaDesdeVal && !horaHastaVal) || (!horaDesdeVal && horaHastaVal)) {
                alert('Las horas debe completarse ambas (hora_desde y hora_hasta) o ninguna.');
                return;
            }

            const nuevoPedido = {
                pedido_id: idVal,
                turno: turnoVal,
                latitud: selectedLat,
                longitud: selectedLng,
                unidades_capacidad: capacidadVal,
                requiere_volcador: volcadorVal,
                hora_desde: horaDesdeVal,
                hora_hasta: horaHastaVal,
                cliente: clienteVal,
                direccion: direccionVal,
                barrio: barrioVal,
                observaciones: observacionesVal
            };

            pedidos.push(nuevoPedido);

            // Remove temp marker
            if (tempMarker) {
                map.removeLayer(tempMarker);
                tempMarker = null;
            }

            // Create persistent marker
            const shortLabel = idVal.length > 4 ? idVal.substring(0, 4) : idVal;
            const iconHtml = `<div class="custom-marker ${volcadorVal === 1 ? 'volcador' : ''}">${shortLabel}</div>`;
            const customIcon = L.divIcon({
                html: iconHtml,
                className: '',
                iconSize: [30, 30],
                iconAnchor: [15, 15]
            });

            const marker = L.marker([selectedLat, selectedLng], { icon: customIcon }).addTo(map);
            marker.bindPopup(`
                <div style="font-family: sans-serif; padding: 4px; color: #1e293b;">
                    <b style="color: #2563eb;">Pedido ${idVal}</b><br>
                    <b>Turno:</b> ${turnoVal}<br>
                    <b>Capacidad:</b> ${capacidadVal}<br>
                    <b>Volcador:</b> ${volcadorVal === 1 ? 'Sí (1)' : 'No (0)'}<br>
                    ${horaDesdeVal ? `<b>Horario:</b> ${horaDesdeVal} - ${horaHastaVal}<br>` : ''}
                    ${clienteVal ? `<b>Cliente:</b> ${clienteVal}<br>` : ''}
                    ${direccionVal ? `<b>Dirección:</b> ${direccionVal}<br>` : ''}
                    ${barrioVal ? `<b>Barrio:</b> ${barrioVal}<br>` : ''}
                    ${observacionesVal ? `<b>Obs:</b> ${observacionesVal}<br>` : ''}
                    <small style="color: #64748b;">Lat: ${selectedLat}, Lng: ${selectedLng}</small>
                </div>
            `);

            mapMarkers.push({ id: idVal, marker: marker });

            // Reset selected coords state
            selectedLat = null;
            selectedLng = null;
            document.getElementById('coords-display').innerText = 'Lat: - | Lng: -';
            document.getElementById('selected-coords-status').innerText = 'Sin punto marcado';
            document.getElementById('selected-coords-status').style.color = '#f59e0b';

            // Prepare ID for next entry
            autoIdCounter++;
            document.getElementById('input-id').value = getNextDefaultId();

            // Clear optional inputs
            document.getElementById('input-cliente').value = '';
            document.getElementById('input-direccion').value = '';
            document.getElementById('input-barrio').value = '';
            document.getElementById('input-observaciones').value = '';

            renderPedidosList();
        }

        function renderPedidosList() {
            const container = document.getElementById('pedidos-container');
            document.getElementById('count-pedidos').innerText = pedidos.length;
            
            const btnExport = document.getElementById('btn-exportar');
            btnExport.disabled = pedidos.length === 0;

            if (pedidos.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; color: #64748b; padding: 20px; font-size: 0.85rem;">
                        No hay puntos agregados todavía.
                    </div>`;
                return;
            }

            container.innerHTML = '';
            pedidos.forEach((p, index) => {
                const item = document.createElement('div');
                item.className = 'pedido-item';
                const turnoBadgeClass = p.turno === 'MANANA' ? 'badge-manana' : 'badge-tarde';
                
                item.innerHTML = `
                    <div class="pedido-info">
                        <div>
                            <span class="pedido-id">${p.pedido_id}</span>
                            <span class="badge-turno ${turnoBadgeClass}">${p.turno}</span>
                        </div>
                        <span class="pedido-details">
                            Cap: ${p.unidades_capacidad} | Volcador: ${p.requiere_volcador} ${p.hora_desde ? `| ${p.hora_desde}-${p.hora_hasta}` : ''}
                        </span>
                        <span class="pedido-details" style="font-family: monospace; font-size: 0.72rem;">
                            (${p.latitud}, ${p.longitud})
                        </span>
                    </div>
                    <button class="btn-delete" title="Eliminar pedido" onclick="eliminarPedido(${index})">✕</button>
                `;
                container.appendChild(item);
            });
        }

        function eliminarPedido(index) {
            const idEliminar = pedidos[index].pedido_id;
            pedidos.splice(index, 1);

            const markerObjIndex = mapMarkers.findIndex(m => m.id === idEliminar);
            if (markerObjIndex !== -1) {
                map.removeLayer(mapMarkers[markerObjIndex].marker);
                mapMarkers.splice(markerObjIndex, 1);
            }

            renderPedidosList();
        }

        function limpiarTodo() {
            if (pedidos.length === 0) return;
            if (confirm('¿Deseas borrar todos los puntos cargados?')) {
                pedidos = [];
                mapMarkers.forEach(m => map.removeLayer(m.marker));
                mapMarkers = [];
                autoIdCounter = 1;
                document.getElementById('input-id').value = getNextDefaultId();
                renderPedidosList();
            }
        }

        function exportarExcel() {
            if (pedidos.length === 0) {
                alert('No hay pedidos para exportar.');
                return;
            }

            // Create worksheet according to contract (pedidos_hoy.xlsx -> sheet: Pedidos)
            const dataToExport = pedidos.map(p => ({
                pedido_id: p.pedido_id,
                turno: p.turno,
                latitud: p.latitud,
                longitud: p.longitud,
                unidades_capacidad: p.unidades_capacidad,
                requiere_volcador: p.requiere_volcador,
                hora_desde: p.hora_desde || '',
                hora_hasta: p.hora_hasta || '',
                cliente: p.cliente || '',
                direccion: p.direccion || '',
                barrio: p.barrio || '',
                observaciones: p.observaciones || ''
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataToExport, {
                header: [
                    "pedido_id", "turno", "latitud", "longitud", 
                    "unidades_capacidad", "requiere_volcador", 
                    "hora_desde", "hora_hasta", "cliente", 
                    "direccion", "barrio", "observaciones"
                ]
            });

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Pedidos");

            XLSX.writeFile(workbook, "pedidos_hoy.xlsx");
        }

        function importarExcel(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    
                    // Look for sheet named "Pedidos" or default to first sheet
                    const sheetName = workbook.SheetNames.includes("Pedidos") ? "Pedidos" : workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[sheetName];
                    
                    const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

                    if (rows.length === 0) {
                        alert('El archivo no contiene filas de datos.');
                        return;
                    }

                    // Process rows by column name (case-insensitive header mapping)
                    let importedCount = 0;
                    const newBounds = [];

                    rows.forEach((row, idx) => {
                        // Find column keys dynamically regardless of position
                        const getVal = (colName) => {
                            const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === colName.toLowerCase());
                            return foundKey !== undefined ? String(row[foundKey]).trim() : '';
                        };

                        const pId = getVal('pedido_id') || getVal('id') || `P_IMP_${idx+1}`;
                        const pTurno = (getVal('turno').toUpperCase() === 'TARDE') ? 'TARDE' : 'MANANA';
                        const pLat = parseFloat(getVal('latitud') || getVal('lat'));
                        const pLng = parseFloat(getVal('longitud') || getVal('lng') || getVal('lon'));
                        const pCapacidad = parseInt(getVal('unidades_capacidad') || getVal('capacidad') || getVal('tamanio') || '1', 10);
                        const pVolcador = (getVal('requiere_volcador') === '1' || getVal('volcador') === '1' || getVal('requiere_volcador').toLowerCase() === 'true') ? 1 : 0;
                        const pHoraDesde = getVal('hora_desde') || getVal('inicio_min') || '';
                        const pHoraHasta = getVal('hora_hasta') || getVal('fin_min') || '';
                        const pCliente = getVal('cliente');
                        const pDireccion = getVal('direccion');
                        const pBarrio = getVal('barrio');
                        const pObs = getVal('observaciones');

                        if (isNaN(pLat) || isNaN(pLng) || pLat < -90 || pLat > 90 || pLng < -180 || pLng > 180) {
                            console.warn(`Fila ${idx + 1} ignorada: Coordenadas inválidas.`, row);
                            return;
                        }

                        // Avoid duplicate ID
                        let finalId = pId;
                        let dupSuffix = 1;
                        while (pedidos.some(p => p.pedido_id === finalId)) {
                            finalId = `${pId}_${dupSuffix++}`;
                        }

                        const itemPedido = {
                            pedido_id: finalId,
                            turno: pTurno,
                            latitud: pLat,
                            longitud: pLng,
                            unidades_capacidad: pCapacidad > 0 ? pCapacidad : 1,
                            requiere_volcador: pVolcador,
                            hora_desde: pHoraDesde,
                            hora_hasta: pHoraHasta,
                            cliente: pCliente,
                            direccion: pDireccion,
                            barrio: pBarrio,
                            observaciones: pObs
                        };

                        pedidos.push(itemPedido);
                        importedCount++;
                        newBounds.push([pLat, pLng]);

                        // Add marker to map
                        const shortLabel = finalId.length > 4 ? finalId.substring(0, 4) : finalId;
                        const iconHtml = `<div class="custom-marker ${pVolcador === 1 ? 'volcador' : ''}">${shortLabel}</div>`;
                        const customIcon = L.divIcon({
                            html: iconHtml,
                            className: '',
                            iconSize: [30, 30],
                            iconAnchor: [15, 15]
                        });

                        const marker = L.marker([pLat, pLng], { icon: customIcon }).addTo(map);
                        marker.bindPopup(`
                            <div style="font-family: sans-serif; padding: 4px; color: #1e293b;">
                                <b style="color: #2563eb;">Pedido ${finalId}</b><br>
                                <b>Turno:</b> ${pTurno}<br>
                                <b>Capacidad:</b> ${pCapacidad}<br>
                                <b>Volcador:</b> ${pVolcador === 1 ? 'Sí (1)' : 'No (0)'}<br>
                                ${pHoraDesde ? `<b>Horario:</b> ${pHoraDesde} - ${pHoraHasta}<br>` : ''}
                                ${pCliente ? `<b>Cliente:</b> ${pCliente}<br>` : ''}
                                ${pDireccion ? `<b>Dirección:</b> ${pDireccion}<br>` : ''}
                                ${pBarrio ? `<b>Barrio:</b> ${pBarrio}<br>` : ''}
                                ${pObs ? `<b>Obs:</b> ${pObs}<br>` : ''}
                                <small style="color: #64748b;">Lat: ${pLat}, Lng: ${pLng}</small>
                            </div>
                        `);

                        mapMarkers.push({ id: finalId, marker: marker });
                    });

                    renderPedidosList();

                    if (newBounds.length > 0) {
                        map.fitBounds(newBounds, { padding: [40, 40] });
                    }

                    alert(`Se importaron con éxito ${importedCount} pedidos desde el Excel.`);

                } catch (err) {
                    console.error(err);
                    alert('Ocurrió un error al leer el archivo Excel.');
                } finally {
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        }

        window.onload = function() {
            initMap();
            document.getElementById('input-id').value = getNextDefaultId();
        };
    </script>
</body>
</html>

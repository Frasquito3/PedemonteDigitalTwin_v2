name: Despliegue de Documentacion

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "python/**"
      - "docs/pdoc_template/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: Compilar Documentacion (pdoc)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r python/requirements.txt

      - name: Compilar documentacion con pdoc
        run: |
          cp README.md docs/pdoc_template/repo_readme.md
          PYTHONPATH=python python -m pdoc -o _site -t docs/pdoc_template -d google --search --math --mermaid --footer-text "Pedemonte Digital Twin • Gemelo Digital v2" planner scripts

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Desplegar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar sitio en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
